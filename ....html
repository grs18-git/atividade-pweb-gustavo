<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca de Times — Scout Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="campo">

    <header class="topo">
      <p class="apito">⚽ scout report</p>
      <h1 class="titulo">Busca de Times</h1>
      <p class="legenda">Digite o nome de um clube e receba a ficha completa direto da central de dados.</p>
    </header>

    <form id="formBusca" class="catraca" autocomplete="off">
      <input
        type="text"
        id="inputTime"
        class="campo-texto"
        placeholder="Ex: Flamengo, Barcelona, Corinthians..."
        aria-label="Nome do time"
      >
      <button type="submit" class="botao-apitar">Apitar busca</button>
    </form>

    <p id="mensagemStatus" class="mensagem-status" role="status"></p>

    <section id="resultado" class="area-resultado"></section>

  </div>

  <script src="script.js"></script>
</body>
</html>
